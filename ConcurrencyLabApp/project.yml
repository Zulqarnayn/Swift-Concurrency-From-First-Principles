# Generate the Xcode project:   cd ConcurrencyLabApp && xcodegen generate && open ConcurrencyLabApp.xcodeproj
#
# Build settings mirror a NEW Xcode 26 iOS app template on purpose:
#   SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor   → every type/function in this target is @MainActor unless you say otherwise
#   SWIFT_APPROACHABLE_CONCURRENCY = YES        → plain `nonisolated async` funcs run on the caller's actor; use @concurrent to leave it
# (The SwiftPM package uses the same "approachable" semantics, but NOT MainActor-by-default.)
name: ConcurrencyLabApp
options:
  bundleIdPrefix: dev.learning.concurrency
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  ConcurrencyLab:
    path: ../ConcurrencyLab
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ConcurrencyLabApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ConcurrencyLab
        product: LabKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.learning.concurrency.lab
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Concurrency Lab"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
