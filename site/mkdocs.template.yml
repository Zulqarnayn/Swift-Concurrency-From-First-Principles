# Template for the generated .site-build/mkdocs.yml. `nav`, `theme.custom_dir` and `extra.contents` are filled in
# by scripts/build-site.py.
site_name: Swift Concurrency, From First Principles
site_description: 86 half-hour sessions on Swift concurrency, from threads and data races to actors, structured concurrency, debugging and senior iOS interviews.
site_url: https://silver-syrniki-b3d81b.netlify.app/
repo_url: https://github.com/Zulqarnayn/Swift-Concurrency-From-First-Principles
repo_name: Zulqarnayn/Swift-Concurrency-From-First-Principles
edit_uri: edit/main/
docs_dir: docs
site_dir: out
strict: true

theme:
  name: null
  locale: en
  static_templates:
    - 404.html

plugins: []

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Link to this section
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.tasklist

extra:
  wordmark: Swift Concurrency
  license: Code MIT · Lesson text CC BY-NC-SA 4.0
