# Template for the generated .site-build/mkdocs.yml. `nav` is generated by scripts/build-site.py.
site_name: Swift Concurrency, From First Principles
site_description: A 86-session, predict-then-run course on Swift concurrency, from threads and data races to actors, structured concurrency, debugging and senior iOS interviews.
site_url: https://silver-syrniki-b3d81b.netlify.app/
repo_url: https://github.com/Zulqarnayn/Swift-Concurrency-From-First-Principles
repo_name: Zulqarnayn/Swift-Concurrency-From-First-Principles
edit_uri: edit/main/
docs_dir: docs
site_dir: out
strict: true

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css
