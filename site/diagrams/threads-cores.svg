<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -14 712 248" width="712" height="248">
<style>
.dg{--dg-paper:#F4F1EA;--dg-ink:#1D1B16;--dg-muted:#6B665C;--dg-rule:#BFB6A4;--dg-fill:#EBE6DA;--dg-green:#0E5A47;--dg-hl:#CFE3D2;--dg-warn:#8A4512}
@media (prefers-color-scheme:dark){.dg{--dg-paper:#17150F;--dg-ink:#E8E2D4;--dg-muted:#A39C8C;--dg-rule:#5A5446;--dg-fill:#211E17;--dg-green:#6FBF9F;--dg-hl:#27453A;--dg-warn:#DDA56E}}
.dg text{font-family:var(--font-ui,-apple-system,"Segoe UI",system-ui,sans-serif);font-size:15px;fill:var(--ink,var(--dg-ink))}
.dg .bg{fill:var(--paper,var(--dg-paper))}
.dg .t{font-weight:600}
.dg .mono,.dg .mono text{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:13px}
.dg .m,.dg .m text{fill:var(--muted,var(--dg-muted));font-size:13px}
.dg .gt{fill:var(--green,var(--dg-green))}
.dg .wt{fill:var(--tok-string,var(--dg-warn))}
.dg .g{fill:var(--green,var(--dg-green))}
.dg .w{fill:var(--tok-string,var(--dg-warn))}
.dg .ln{stroke:var(--muted,var(--dg-muted));stroke-width:1.5;fill:none}
.dg .box{fill:var(--code-bg,var(--dg-fill));stroke:var(--muted,var(--dg-rule));stroke-width:1}
.dg .hl{fill:var(--highlight,var(--dg-hl));stroke:var(--green,var(--dg-green));stroke-width:1}
.dg .lock{fill:var(--code-bg,var(--dg-fill));stroke:var(--green,var(--dg-green));stroke-width:2}
.dg .idle{fill:none;stroke:var(--muted,var(--dg-rule));stroke-width:1.5;stroke-dasharray:5 4}
.dg .region{fill:none;stroke:var(--muted,var(--dg-rule));stroke-width:1.5;stroke-dasharray:6 4}
.dg .gs{stroke:var(--green,var(--dg-green));fill:none;stroke-width:2}
.dg .gsd{stroke:var(--green,var(--dg-green));fill:none;stroke-width:1.5;stroke-dasharray:4 3}
.dg .ws{stroke:var(--tok-string,var(--dg-warn));fill:none;stroke-width:1.5}
.dg .wsd{stroke:var(--tok-string,var(--dg-warn));fill:none;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect class="bg" x="-16" y="-14" width="712" height="248" rx="8"/>
<defs><marker id="tc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="g"/></marker>
<marker id="tc-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted,var(--dg-muted))"/></marker></defs>
<text x="0" y="61">Core 1</text>
<text x="0" y="121">Core 2</text>
<g class="mono">
<rect class="hl" x="90" y="38" width="110" height="36" rx="3"/><text x="145" y="61" text-anchor="middle">T1</text>
<rect class="box" x="206" y="38" width="94" height="36" rx="3"/><text x="253" y="61" text-anchor="middle">T3</text>
<rect class="hl" x="306" y="38" width="114" height="36" rx="3"/><text x="363" y="61" text-anchor="middle">T1</text>
<rect class="box" x="426" y="38" width="104" height="36" rx="3"/><text x="478" y="61" text-anchor="middle">T5</text>
<rect class="box" x="536" y="38" width="124" height="36" rx="3"/><text x="598" y="61" text-anchor="middle">T3</text>
<rect class="box" x="90" y="98" width="100" height="36" rx="3"/><text x="140" y="121" text-anchor="middle">T2</text>
<rect class="box" x="196" y="98" width="124" height="36" rx="3"/><text x="258" y="121" text-anchor="middle">T4</text>
<rect class="box" x="326" y="98" width="114" height="36" rx="3"/><text x="383" y="121" text-anchor="middle">T2</text>
<rect class="box" x="446" y="98" width="94" height="36" rx="3"/><text x="493" y="121" text-anchor="middle">T4</text>
<rect class="box" x="546" y="98" width="114" height="36" rx="3"/><text x="603" y="121" text-anchor="middle">T5</text>
</g>
<path class="gs" d="M203,8 V32" marker-end="url(#tc-a)"/>
<text x="212" y="22" class="m gt">context switch: save T1, load T3</text>
<path class="ln" d="M90,162 H655" marker-end="url(#tc-t)"/>
<text x="90" y="184" class="m">time, a few milliseconds per slice</text>
<text x="0" y="212" class="m">Five threads, two cores: each core runs one thread at a time, and T1 waits its turn to continue.</text>
</svg>
