<!doctype html>
<!-- Source of .github/assets/social-preview.png (GitHub social preview, 1280×640):
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1280,640 --screenshot=.github/assets/social-preview.png site/social.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Fraunces"; src: url("theme/fonts/fraunces.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Source Serif 4"; src: url("theme/fonts/source-serif-4.woff2") format("woff2"); font-weight: 200 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("theme/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #F4F1EA;
    color: #1D1B16;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 72px 96px 64px;
    box-sizing: border-box;
  }
  .eyebrow {
    font: 500 17px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #0E5A47;
  }
  .eyebrow span + span::before { content: "/"; margin: 0 0.8em; color: #C9C1B1; }
  h1 {
    align-self: center;
    margin: 0;
    font: 300 104px/1.0 "Fraunces", serif;
    letter-spacing: -0.025em;
    font-variation-settings: "opsz" 144, "SOFT" 30;
  }
  h1 em { font-style: normal; color: #0E5A47; }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1.5px solid #1D1B16;
    padding-top: 22px;
    font: 400 26px/1.4 "Source Serif 4", serif;
    color: #6B665C;
  }
</style>
</head>
<body>
  <p class="eyebrow"><span>86 sessions</span><span>30 min each</span><span>Predict · Run · Explain</span></p>
  <h1>Swift concurrency,<br><em>from first principles</em></h1>
  <div class="foot">
    <span>Threads to actors, structured concurrency, real bugs, iOS interviews.</span>
  </div>
</body>
</html>
